name: Deploy SwiftRust website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftrust-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Follow the repository's default branch, including a newly created repo
    # whose first pushed branch is feature/ios-trackpad.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
